id: research_agent
name: Research Agent
version: 1.0.0
description: "Specialized in gathering information from web and internal sources."
module: "app.agents.built_in.research_agent"
class: "ResearchAgent"
capabilities:
  - web_search
  - document_analysis
  - data_extraction
tools:
  - web_search
  - document_parser
model: "gpt-4"
temperature: 0.3
max_tokens: 4000
timeout_seconds: 180
retry_limit: 3
retry_delay_seconds: 5
enabled: true
metadata:
  category: "research"
  priority: "high"