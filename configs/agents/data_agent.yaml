id: data_agent
name: Data Agent
version: 1.0.0
description: "Analyzes structured and unstructured data, performs transformations."
module: "app.agents.built_in.data_agent"
class: "DataAgent"
capabilities:
  - data_analysis
  - sql_query
  - visualization
tools:
  - database_connector
  - pandas_engine
  - chart_generator
model: "gpt-4"
temperature: 0.1
max_tokens: 6000
timeout_seconds: 240
retry_limit: 3
retry_delay_seconds: 5
enabled: true
metadata:
  category: "data"
  priority: "medium"