id: example_research_workflow
name: Research and Report Workflow
description: "Gathers data, analyzes it, and generates a final report."
steps:
  - id: step-1
    agent_id: research_agent
    depends_on: []
    input_map:
      query: "{{ initial_query }}"
  - id: step-2
    agent_id: data_agent
    depends_on: ["step-1"]
    input_map:
      raw_data: "{{ step-1.output }}"
  - id: step-3
    agent_id: coding_agent
    depends_on: ["step-2"]
    input_map:
      analysis: "{{ step-2.output }}"
      format: "markdown"
  - id: step-4
    agent_id: automation_agent
    depends_on: ["step-3"]
    input_map:
      report: "{{ step-3.output }}"
      action: "save_and_email"