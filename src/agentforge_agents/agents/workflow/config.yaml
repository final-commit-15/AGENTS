id: workflow
name: Workflow Agent
description: Executes pipelines, DAGs, retries, and checkpoints.
version: 1.0.0
agent_class: agentforge_agents.agents.workflow.agent.Agent
enabled: true
max_iterations: 5
timeout_seconds: 90.0
max_retries: 1
tools:
  - http
  - python_runner
  - filesystem
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.2
  max_tokens: 2048
memory:
  enabled: true
  namespace: workflow
  ttl_seconds: 86400
  session_isolation: true
  embeddable: true
metadata:
  category: operations
