id: research
name: Research Agent
description: Gathers and synthesizes information with provenance and citations.
version: 1.0.0
agent_class: agentforge_agents.agents.research.agent.Agent
enabled: true
max_iterations: 5
timeout_seconds: 90.0
max_retries: 1
tools:
  - search
  - http
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.2
  max_tokens: 2048
memory:
  enabled: true
  namespace: research
  ttl_seconds: 86400
  session_isolation: true
  embeddable: true
metadata:
  category: knowledge
