id: communication
name: Communication Agent
description: Composes and dispatches emails, Slack messages, and meeting notes.
version: 1.0.0
agent_class: agentforge_agents.agents.communication.agent.Agent
enabled: true
max_iterations: 5
timeout_seconds: 90.0
max_retries: 1
tools:
  - email
  - slack
  - notion
  - calendar
model:
  provider: openai
  name: gpt-4o-mini
  temperature: 0.2
  max_tokens: 2048
memory:
  enabled: true
  namespace: communication
  ttl_seconds: 86400
  session_isolation: true
  embeddable: true
metadata:
  category: communications
