[build-system]
requires = ["setuptools>=69.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentforge-agents"
version = "1.0.0"
description = "Agent execution and orchestration layer for AgentForge - modular multi-agent framework with tool calling, memory, events, and streaming."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AgentForge Team", email = "team@agentforge.com" }]
keywords = ["ai", "agents", "orchestration", "workflow", "llm", "multi-agent"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

dependencies = [
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",
    "pyyaml>=6.0.1",
    "httpx>=0.27.0",
    "structlog>=24.1.0",
    "python-dotenv>=1.0.1",
    "redis>=5.0.0",
    "jinja2>=3.1.0",
    "orjson>=3.9.0",
    "fastapi>=0.111.0",
    "uvicorn>=0.29.0",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30.0"]
docs = ["markdown>=3.5.0"]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.4.0",
    "black>=24.0.0",
    "mypy>=1.9.0",
    "pip-check>=0.1.0",
    "openai>=1.30.0",
]
full = ["agentforge-agents[llm,dev]"]

[project.scripts]
agentforge-benchmark = "agentforge_agents.evals.cli:main"
agentforge-agents = "agentforge_agents.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentforge_agents*"]

[tool.setuptools.package-data]
agentforge_agents = ["**/*.yaml", "**/*.yml", "**/*.md", "**/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "-ra --strict-markers"
markers = [
    "unit: unit tests",
    "integration: integration tests",
    "smoke: smoke tests",
    "docker: tests requiring docker",
    "slow: slow tests",
]

[tool.ruff]
line-length = 100
target-version = "py312"
exclude = ["docs", ".venv"]
extend-select = ["E", "F", "W", "I", "N", "UP", "B", "C4", "SIM"]
ignore = ["E501", "UP047", "RUF012", "SIM105", "W292", "S110", "SIM102", "S102", "S112", "C408", "B007", "C401", "F841", "D419", "C416", "B904", "SIM103", "TRY203", "ASYNC230"]

[tool.ruff.lint.isort]
known-first-party = ["agentforge_agents"]

[tool.black]
line-length = 100
target-version = ["py312"]
include = '\.pyi?$'

[tool.mypy]
python_version = "3.12"
packages = ["agentforge_agents"]
warn_return_any = false
warn_unused_configs = true
warn_redundant_casts = true
check_untyped_defs = true
disallow_untyped_defs = false
ignore_missing_imports = true
follow_imports = "normal"
show_error_codes = true
exclude = [
    "(^|/)tests/",
    "(^|/)evals/",
    "(^|/)examples/",
]

[[tool.mypy.overrides]]
module = [
    "agentforge_agents.tools.terminal",
    "agentforge_agents.tools.vector_db",
    "agentforge_agents.utils.config",
    "agentforge_agents.memory.embeddings",
    "agentforge_agents.prompts.manager",
    "agentforge_agents.events.bus",
    "agentforge_agents.events.adapters.local",
    "agentforge_agents.core.telemetry",
    "agentforge_agents.memory.short_term",
    "agentforge_agents.tools.search",
    "agentforge_agents.tools.__init__",
    "agentforge_agents.agents.planner.agent",
    "agentforge_agents.config.loader",
    "agentforge_agents.agents.workflow.agent",
    "agentforge_agents.agents.document.agent",
    "agentforge_agents.agents.data.agent",
    "agentforge_agents.agents.communication.agent",
    "agentforge_agents.agents.browser.agent",
    "agentforge_agents.agents.automation.agent",
    "agentforge_agents.orchestration.executor",
]
ignore_errors = true

[tool.coverage.run]
source = ["agentforge_agents"]
omit = ["*/tests/*", "*/examples/*", "*/evals/*"]

[tool.coverage.report]
fail_under = 90
show_missing = true