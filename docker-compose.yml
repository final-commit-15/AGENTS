services:
  agents:
    build: .
    ports:
      - "8001:8000"
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - AI_SERVICES_URL=http://ai-services:8080
    volumes:
      - ./configs:/app/configs
      - ./app:/app/app
    networks:
      agentforge-network:
        aliases:
          - agentforge-agents
    restart: unless-stopped

networks:
  agentforge-network:
    external: true