version: '3.8'

services:
  agents:
    build: .
    ports:
      - "8000:8000"  # if we expose an API
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - AI_SERVICES_URL=http://ai-services:8080
    volumes:
      - ./configs:/app/configs
      - ./app:/app/app
    restart: unless-stopped